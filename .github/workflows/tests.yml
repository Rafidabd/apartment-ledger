name: Test the ledger

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run ledger tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/basket.js
          node --check static/item-suggest.js
          node --check demo/demo.js
          node --check tests/verify_demo.cjs
      - name: Verify fictional public demo
        run: node tests/verify_demo.cjs
